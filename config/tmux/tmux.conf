# Cores e estilo da barra de status
set -g status-style bg=colour235,fg=colour255
set -g status-position bottom
set -g status-justify left

# Lado esquerdo da barra
set -g status-left-length 40
set -g status-left '#[fg=colour235,bg=colour35,bold] #S #[fg=colour35,bg=colour235] '

# Lado direito da barra
set -g status-right-length 60
set -g status-right '#[fg=colour240] #[fg=colour255,bg=colour240] %H:%M #[fg=colour245] #[fg=colour235,bg=colour245,bold] %d/%m '

# Janelas na barra
setw -g window-status-format '#{?window_bell_flag,#[fg=colour235#,bg=colour220#,bold] #I:#W #[fg=colour220#,bg=colour235] ,#[fg=colour245] #I:#W }'

# Bell / alertas: uma janela em segundo plano que recebe BEL (\a) fica pintada
# de amarelo (como a selecionada fica de verde) até você entrar nela. O Claude
# Code envia BEL ao terminar ou pedir permissão (ver config/claude/hooks.json).
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
# O padrão do tmux é "reverse", que inverte as cores definidas acima.
setw -g window-status-bell-style none
setw -g window-status-current-format '#[fg=colour235,bg=colour35,bold] #I:#W #[fg=colour35,bg=colour235] '

# Borda das janelas
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour2

# Habilita scroll com mouse
set -g mouse on


# Aumenta o histórico de linhas (padrão é só 2000)
set -g history-limit 50000

# Numeração de janelas começa do 1 (ao invés de 0, mais ergonômico)
set -g base-index 1
setw -g pane-base-index 1

# Renumera janelas automaticamente quando você fecha uma
set -g renumber-windows on

# Reduz o delay do ESC (importante pro Vim/Neovim)
set -sg escape-time 0

# Ativa suporte a 256 cores
set -g default-terminal "screen-256color"

# Atualiza a barra de status a cada segundo
set -g status-interval 1

# Mantém o nome da janela que você definiu (não muda automaticamente)
set -g allow-rename off

# Config de copiar e colar

set -g mode-keys vi
set -g set-clipboard on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"


